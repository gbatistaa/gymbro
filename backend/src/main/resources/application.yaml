spring:
  application:
    name: gymbro
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 1MB
  config:
    # .env no formato KEY=VALUE; [.properties] = hint de extensão (formato fora do padrão)
    # optional: para bootar sem o arquivo (defaults abaixo valem)
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gymbro}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jwt:
    secret: ${JWT_SECRET:vb/3tfg32s3347qCevonfOLwZdeuDp6pcaQIWh+ezYg4VzSJFUrRy9iggWtMUKGaJRTB30JGi/6YaDORbCmrEw==}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:15552000000}

bioimpedance:
  parser:
    base-url: ${BIOIMPEDANCE_PARSER_URL:http://localhost:8000}
    timeout: ${BIOIMPEDANCE_PARSER_TIMEOUT:60s}
    token: ${BIOIMPEDANCE_PARSER_TOKEN:}
  import:
    stale-after: ${BIOIMPEDANCE_IMPORT_STALE_AFTER:3m}
