spring:
  application:
    name: gymbro
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
      file-size-threshold: 1MB
  config:
    # .env no formato KEY=VALUE; [.properties] = hint de extensão (formato fora do padrão)
    # optional: para bootar sem o arquivo (defaults abaixo valem)
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gymbro}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        # Hibernate 7 prefere o mapper Jackson 2 quando os dois convivem, e o springdoc traz
        # Jackson 2 junto. Sem fixar o Jackson 3, `tools.jackson.databind.JsonNode` para de
        # desserializar (auditoria de bioimpedância e jobs de import devolvem 500).
        type.json_format_mapper: org.hibernate.type.format.jackson.Jackson3JsonFormatMapper
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jwt:
    secret: ${JWT_SECRET:vb/3tfg32s3347qCevonfOLwZdeuDp6pcaQIWh+ezYg4VzSJFUrRy9iggWtMUKGaJRTB30JGi/6YaDORbCmrEw==}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:15552000000}

bioimpedance:
  parser:
    base-url: ${BIOIMPEDANCE_PARSER_URL:http://localhost:8000}
    timeout: ${BIOIMPEDANCE_PARSER_TIMEOUT:60s}
    token: ${BIOIMPEDANCE_PARSER_TOKEN:}
  import:
    stale-after: ${BIOIMPEDANCE_IMPORT_STALE_AFTER:3m}

app:
  openapi:
    public: ${OPENAPI_PUBLIC:true}

  cors:
    # alvo web do Expo; nativo ignora CORS
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081}
  auth:
    rate-limit:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      window: ${LOGIN_ATTEMPT_WINDOW:PT15M}
